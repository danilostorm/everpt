<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Criar conta — EverPT</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#483121 0%,#191517 43%,#0d0d11 85%);color:#eae5df}
main{width:min(460px,100%);padding:36px 32px;background:linear-gradient(145deg,#212026,#141317);border:1px solid #655037;box-shadow:0 18px 75px #000b;border-radius:12px}
h1{font:600 34px/1.2 Georgia,serif;letter-spacing:.06em;color:#f2d89f;text-align:center;margin:0}
h2{text-align:center;font-weight:500;font-size:18px;margin:10px 0 26px;color:#dfd0b4}
p{color:#b9b2aa;line-height:1.45}
label{display:block;margin:15px 0 6px;color:#d9cebd;font-size:14px}
input:not([type=checkbox]){width:100%;padding:12px 13px;background:#0e0d12;border:1px solid #665742;border-radius:6px;color:white;font:16px system-ui}
input:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid #efc16c;outline-offset:2px}
small{color:#a7a19a;display:block;margin-top:6px}
button{width:100%;border:1px solid #c6a057;border-radius:6px;color:#251c12;background:linear-gradient(#f5d694,#d2a85d);font:600 16px system-ui;margin-top:26px;padding:13px;cursor:pointer}
button[disabled]{opacity:.65;cursor:wait}
#message{margin-top:16px;min-height:28px;color:#ffc0aa}
#message.success{color:#a7e4b0}
nav{text-align:center;margin-top:20px}a{color:#e7c47d;text-underline-offset:3px}
.honey{position:absolute;left:-100vw;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body>
<main>
<h1>EVERPT</h1>
<h2>Criar uma conta</h2>
<p>Use a mesma conta para jogar no computador ou no navegador. Seus personagens e progresso ficam no mesmo servidor EverPT.</p>
<form id="register" method="post" action="/api/register" autocomplete="on">
  <label for="username">Nome de usuário</label>
  <input id="username" name="username" autocomplete="username" minlength="3" maxlength="20" pattern="[A-Za-z0-9_]{3,20}" required spellcheck="false" placeholder="3 a 20 letras, números ou _">
  <small>Seu nome de usuário será usado no login do jogo.</small>
  <label for="password">Senha</label>
  <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" maxlength="20" required>
  <small>De 8 a 20 caracteres. Use uma senha exclusiva.</small>
  <label for="confirm">Confirmar senha</label>
  <input type="password" id="confirm" name="confirm" autocomplete="new-password" minlength="8" maxlength="20" required>
  <div class="honey" aria-hidden="true"><label for="website">Site</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
  <button id="submit" type="submit">Criar conta</button>
  <div id="message" role="status" aria-live="polite"></div>
</form>
<nav><a href="/">Já tem uma conta? Voltar ao jogo</a></nav>
</main>
<script type="module" src="/cadastro.js"></script>
</body></html>
