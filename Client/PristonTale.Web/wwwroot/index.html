<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EverPT Web</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: #0b0d10; color: #e6e6e6; font: 13px/1.5 system-ui, sans-serif; }
  #stage { display: flex; align-items: center; justify-content: center; height: 100%; }
  canvas { display: block; outline: none; }
  #tools { position: fixed; top: 8px; right: 8px; display: flex; gap: 6px; z-index: 20; }
  #tools button { background: rgba(21, 21, 28, .78); color: #d8d4c8; border: 1px solid #3a3426; border-radius: 5px; padding: 4px 10px; font: 12.5px system-ui, sans-serif; cursor: pointer; }
  #tools button:hover, #tools button:focus-visible { border-color: #9a7430; color: #f0d896; }
  #tools button[hidden], #fps[hidden] { display: none; }
  #fps { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, .55); padding: 2px 8px; border-radius: 4px; font: 12px ui-monospace, Consolas, monospace; z-index: 20; pointer-events: none; }
  #panel { position: fixed; inset: 0; background: rgba(5, 5, 8, .66); display: flex; align-items: flex-start; justify-content: center; overflow: auto; padding: 24px 16px; z-index: 50; }
  #panel[hidden] { display: none; }
  .mg-box { background: #15151c; border: 1px solid #3a3426; border-radius: 8px; color: #d8d4c8; width: 100%; max-width: 640px; padding: 18px 22px 22px; box-sizing: border-box; font: 13.5px/1.5 system-ui, sans-serif; }
  .mg-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .mg-box h2 { font: 600 19px/1.3 Georgia, "Times New Roman", serif; color: #e8cf8e; margin: 0; }
  .mg-box h3 { font: 600 12px/1.3 system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #a8915c; margin: 20px 0 6px; }
  .mg-row { display: grid; grid-template-columns: minmax(150px, 40%) 1fr; align-items: center; gap: 2px 14px; padding: 6px 0; border-top: 1px solid #23222b; }
  .mg-control { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .mg-help { grid-column: 1 / -1; color: #8a8476; font-size: 12px; }
  .mg-value { color: #a8a294; font-variant-numeric: tabular-nums; min-width: 64px; text-align: right; font-size: 12.5px; }
  .mg-box input[type=range] { flex: 1; min-width: 0; accent-color: #c9a14d; }
  .mg-box input[type=checkbox] { width: 16px; height: 16px; accent-color: #c9a14d; }
  .mg-box select, .mg-box input:not([type]) { background: #1d1c24; color: #d8d4c8; border: 1px solid #34323c; border-radius: 5px; padding: 4px 8px; font: inherit; min-width: 0; box-sizing: border-box; }
  .mg-button { background: #22212a; color: #d8d4c8; border: 1px solid #34323c; border-radius: 4px; padding: 4px 12px; font: inherit; cursor: pointer; }
  .mg-button:hover:not(:disabled) { border-color: #7a6230; color: #f0d896; }
  .mg-button:disabled { opacity: .45; cursor: default; }
  .mg-button.danger { border-color: #6b3a32; color: #f0b3a4; }
  .mg-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
  .mg-label { margin-right: 6px; }
  .mg-seg { display: inline-flex; flex-wrap: wrap; border: 1px solid #34323c; border-radius: 5px; overflow: hidden; }
  .mg-seg button { background: #1d1c24; color: #b8b2a4; border: 0; padding: 4px 12px; font: inherit; cursor: pointer; }
  .mg-seg button + button { border-left: 1px solid #34323c; }
  .mg-seg button:disabled { cursor: default; }
  .mg-seg button[aria-pressed=true] { background: #3a3020; color: #f0d896; }
  .mg-note { color: #a8a294; margin: 8px 0; }
  .mg-log { height: 160px; overflow-y: auto; background: #0e0e13; border: 1px solid #26242e; border-radius: 6px; padding: 6px 10px; font: 12.5px/1.45 ui-monospace, Consolas, monospace; overflow-wrap: anywhere; }
  .mg-log .mine { color: #e8cf8e; }
  .mg-log .server { color: #ff8060; }
  .mg-log .whisper { color: #96beff; }
  .mg-log .notice { color: #e6a0ff; }
  .mg-command { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px; padding: 8px 0; border-top: 1px solid #23222b; }
  .mg-command label { display: flex; flex-direction: column; gap: 2px; flex: 1 1 120px; font-size: 12px; color: #a8a294; }
  .mg-command.line { border-top: 0; flex-wrap: nowrap; }
  .mg-command.line input { flex: 1; }
  .mg-box details { margin-top: 10px; border: 1px solid #26242e; border-radius: 6px; padding: 4px 12px; }
  .mg-box summary { cursor: pointer; color: #e8cf8e; padding: 4px 0; }
  @media (max-width: 480px) { .mg-row { grid-template-columns: 1fr; } }
  #loading { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); box-sizing: border-box; width: min(460px, calc(100% - 32px)); padding: 20px 22px;
    background: rgba(11, 11, 16, .92); border: 1px solid #3a3426; border-radius: 8px; display: flex; flex-direction: column; gap: 8px; }
  #loading.small { top: auto; bottom: 12px; transform: translateX(-50%); width: min(360px, calc(100% - 32px)); padding: 8px 12px; gap: 5px; font-size: 12px; pointer-events: none; }
  #loading[hidden] { display: none; }
  #title { font: 600 16px/1.3 Georgia, "Times New Roman", serif; color: #e8cf8e; }
  #loading.small #title { font-size: 12.5px; }
  #bar { height: 6px; border-radius: 3px; background: #2a2620; overflow: hidden; position: relative; }
  #fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #9a7430, #e2bb62); border-radius: 3px; transition: width .2s; }
  #bar.busy #fill { width: 30%; animation: busy 1.2s ease-in-out infinite; }
  @keyframes busy { 0% { left: -30%; } 100% { left: 100%; } }
  @media (prefers-reduced-motion: reduce) { #bar.busy #fill { animation: none; width: 100%; opacity: .5; } #fill { transition: none; } }
  #detail { color: #a8a294; font-variant-numeric: tabular-nums; }
  #note { color: #807a6c; font-size: 12px; }
  #loading.small #note { display: none; }
  #register-link { color: #e8cf8e; align-self: flex-start; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
  #register-link:hover, #register-link:focus-visible { color: #fff0c9; }
  #loading.small #register-link { display: none; }
  #error { color: #ff9c8a; white-space: pre-wrap; overflow-wrap: anywhere; }
  #error:empty { display: none; }
</style>
</head>
<body>
<div id="stage"><canvas id="game" width="1280" height="720"></canvas></div>
<div id="loading" role="status" aria-live="polite">
  <div id="title">Carregando EverPT</div>
  <div id="bar" class="busy"><div id="fill"></div></div>
  <div id="detail"></div>
  <div id="note">Use sua conta do EverPT para jogar aqui ou no desktop, com os mesmos personagens e progresso.</div>
  <a id="register-link" href="/cadastro">Criar conta — sem esperar o jogo carregar</a>
  <div id="error"></div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
